<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#111111" />
<meta name="taste-archive-build" content="2026-08-19-mobile-drawer-2" />
<title>TASTE ARCHIVE</title>
<style>
  :root{
    --bg:#f4f1ea; --panel:#fffdf8; --panel-2:#ece8de; --text:#171717; --muted:#6e6a62;
    --line:#d8d2c7; --accent:#b84a2a; --accent-2:#7d2f1d; --good:#47715f; --shadow:0 12px 30px rgba(40,30,20,.08);
    --radius:20px; --radius-sm:12px; --sidebar:250px;
  }
  [data-theme="dark"]{
    --bg:#11110f; --panel:#181816; --panel-2:#22221f; --text:#f5f1e8; --muted:#aaa49a;
    --line:#373630; --accent:#e47452; --accent-2:#f09a80; --good:#78a78f; --shadow:0 12px 30px rgba(0,0,0,.28);
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth;-webkit-text-size-adjust:100%;text-size-adjust:100%;overflow-x:hidden}
  body{margin:0;background:var(--bg);color:var(--text);font-family:Inter, Pretendard, "Noto Sans KR", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;overflow-x:hidden}
  button,input,textarea,select{font:inherit}
  button{cursor:pointer}
  a{color:inherit}
  .app{min-height:100vh;display:grid;grid-template-columns:var(--sidebar) 1fr}
  .sidebar{position:fixed;inset:0 auto 0 0;width:var(--sidebar);padding:26px 18px;background:var(--panel);border-right:1px solid var(--line);z-index:30}
  .brand{display:block;border:0;background:none;color:var(--text);text-align:left;padding:0 10px 28px;width:100%}
  .brand strong{display:block;font-family:Georgia, "Times New Roman", serif;font-size:23px;letter-spacing:.07em}
  .brand span{font-size:12px;color:var(--muted)}
  .nav{display:flex;flex-direction:column;gap:6px}
  .nav button{border:0;background:transparent;color:var(--muted);padding:12px 13px;text-align:left;border-radius:12px;font-weight:700}
  .nav button:hover,.nav button.active{background:var(--panel-2);color:var(--text)}
  .nav .section-label{padding:18px 13px 6px;color:var(--muted);font-size:10px;letter-spacing:.16em}
  .side-bottom{position:absolute;left:18px;right:18px;bottom:20px;display:grid;grid-template-columns:1fr 44px;gap:8px}
  .mobile-menu-btn,.mobile-menu-overlay{display:none}

  .main{grid-column:2;padding:0 34px 60px;min-width:0}
  .topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:18px 0;background:linear-gradient(var(--bg) 72%, transparent)}
  .search{flex:1;max-width:650px;position:relative;min-width:0}
  .search input{width:100%;border:1px solid var(--line);background:var(--panel);color:var(--text);padding:13px 16px 13px 42px;border-radius:999px;outline:none}
  .search:before{content:"⌕";position:absolute;left:17px;top:7px;font-size:22px;color:var(--muted)}
  .icon-btn,.btn{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:12px;padding:11px 14px;font-weight:700}
  .icon-btn{width:44px;height:44px;padding:0}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.ghost{background:transparent}
  .btn.danger{border-color:#a43d32;color:#b9463a}
  .page{max-width:1300px;margin:0 auto}
  .hero{display:grid;grid-template-columns:1.35fr .65fr;gap:18px;margin:12px 0 28px}
  .hero-main{background:var(--panel);border:1px solid var(--line);border-radius:28px;padding:44px;min-height:310px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:var(--shadow)}
  .eyebrow{font-size:11px;letter-spacing:.16em;color:var(--accent);font-weight:800}
  h1,h2,h3,p{margin-top:0}
  .hero h1{font-family:Georgia,"Times New Roman",serif;font-size:clamp(40px,6vw,76px);line-height:.95;margin:16px 0 18px;letter-spacing:-.04em}
  .hero p{max-width:680px;color:var(--muted);font-size:15px;line-height:1.7}
  .hero-actions{display:flex;gap:9px;flex-wrap:wrap}
  .hero-side{display:grid;grid-template-rows:repeat(3,1fr);gap:12px}
  .stat-card,.card,.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
  .stat-card{padding:20px;display:flex;justify-content:space-between;align-items:end}
  .stat-card strong{font-size:34px;font-family:Georgia,serif}
  .stat-card span{color:var(--muted);font-size:12px}
  .section-head{display:flex;align-items:end;justify-content:space-between;gap:10px;margin:28px 0 14px}
  .section-head h2{font-size:20px;margin:0}
  .section-head p{margin:5px 0 0;color:var(--muted);font-size:13px}
  .grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
  .card{overflow:hidden}
  .card-media{aspect-ratio:16/10;background:var(--panel-2);display:flex;align-items:center;justify-content:center;color:var(--muted);overflow:hidden}
  .card-media img{width:100%;height:100%;object-fit:cover}
  .card-body{padding:17px}
  .card-kicker{font-size:11px;color:var(--accent);font-weight:800;letter-spacing:.06em}
  .card-title{font-size:18px;font-weight:800;margin:7px 0}
  .card-meta{font-size:12px;color:var(--muted);line-height:1.6}
  .card-tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
  .tag{border:1px solid var(--line);border-radius:999px;padding:5px 8px;font-size:11px;color:var(--muted);background:transparent}
  .empty{padding:50px 20px;text-align:center;border:1px dashed var(--line);border-radius:18px;color:var(--muted)}
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 16px}
  .chips{display:flex;gap:7px;flex-wrap:wrap}
  .chip{border:1px solid var(--line);background:var(--panel);color:var(--muted);padding:8px 11px;border-radius:999px;font-size:12px;font-weight:700}
  .chip.active{background:var(--text);color:var(--bg);border-color:var(--text)}
  .split{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .panel{padding:22px}
  .form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
  .form-group{display:flex;flex-direction:column;gap:7px;min-width:0}
  .form-group.full{grid-column:1/-1}
  label{font-size:12px;color:var(--muted);font-weight:700}
  input,textarea,select,.editor{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:12px;padding:12px 13px;outline:none;max-width:100%;min-width:0}
  input:not([type="checkbox"]):not([type="radio"]),textarea,select,.editor{width:100%;font-size:16px}
  input[type="checkbox"],input[type="radio"]{width:auto;min-width:auto;flex:0 0 auto}
  textarea{min-height:100px;resize:vertical;line-height:1.6}
  input:focus,textarea:focus,select:focus,.editor:focus{border-color:var(--accent)}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;display:none;align-items:flex-start;justify-content:center;padding:30px 16px;overflow:auto}
  .modal.open{display:flex}
  .modal-card{width:min(900px,100%);background:var(--bg);border:1px solid var(--line);border-radius:24px;box-shadow:0 30px 80px rgba(0,0,0,.35);overflow:hidden}
  .modal-head{position:sticky;top:0;z-index:2;background:var(--bg);display:flex;justify-content:space-between;align-items:center;padding:18px 22px;border-bottom:1px solid var(--line)}
  .modal-head h2{margin:0;font-size:20px}
  .modal-body{padding:22px}
  .modal-foot{display:flex;justify-content:flex-end;gap:8px;padding:16px 22px;border-top:1px solid var(--line);position:sticky;bottom:0;background:var(--bg)}
  .photos{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .photo{aspect-ratio:1;border-radius:12px;background:var(--panel-2);overflow:hidden;position:relative}
  .photo img{width:100%;height:100%;object-fit:cover}
  .photo button{position:absolute;right:5px;top:5px;border:0;border-radius:999px;background:rgba(0,0,0,.65);color:#fff;width:25px;height:25px}
  .dyn-list{display:flex;flex-direction:column;gap:8px}
  .dyn-row{display:grid;grid-template-columns:1.2fr .5fr .45fr 40px;gap:8px}
  .step-row{display:grid;grid-template-columns:40px 1fr 40px;gap:8px;align-items:start}
  .step-no{width:40px;height:40px;display:grid;place-items:center;border-radius:50%;background:var(--panel-2);font-weight:800}
  .editor-toolbar{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:7px}
  .editor-toolbar button{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:8px;padding:7px 9px}
  .editor{min-height:260px;line-height:1.7}
  .detail-cover{width:100%;aspect-ratio:16/7;background:var(--panel-2);border-radius:18px;overflow:hidden;margin-bottom:18px}
  .detail-cover img{width:100%;height:100%;object-fit:cover}
  .detail-title{font-size:34px;font-family:Georgia,"Times New Roman",serif;margin:5px 0 8px}
  .detail-meta{color:var(--muted);font-size:13px}
  .detail-section{padding:18px 0;border-top:1px solid var(--line)}
  .detail-section h3{font-size:14px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
  .kv{display:grid;grid-template-columns:160px 1fr;gap:8px 18px;font-size:14px}
  .kv div:nth-child(odd){color:var(--muted)}
  .rich{line-height:1.75}
  .rich blockquote{margin:12px 0;border-left:3px solid var(--accent);padding-left:14px;color:var(--muted)}
  .bar-list{display:flex;flex-direction:column;gap:10px}
  .bar-row{display:grid;grid-template-columns:120px 1fr 48px;align-items:center;gap:10px;font-size:12px}
  .bar{height:10px;background:var(--panel-2);border-radius:999px;overflow:hidden}
  .bar i{display:block;height:100%;background:var(--accent);border-radius:inherit}
  .notice{padding:13px 14px;border-radius:12px;background:var(--panel-2);color:var(--muted);font-size:12px;line-height:1.5}
  .switch-line{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:15px 0;border-bottom:1px solid var(--line)}
  .switch-line:last-child{border-bottom:0}
  .small{font-size:12px;color:var(--muted)}
  .fab{display:none}

  .cloud-pill{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:999px;padding:9px 12px;font-size:12px;font-weight:800}
  .cloud-pill .dot{width:8px;height:8px;border-radius:50%;background:#8f8b82}
  .cloud-pill.online{color:var(--good)} .cloud-pill.online .dot{background:var(--good)}
  .cloud-pill.warn{color:var(--accent)} .cloud-pill.warn .dot{background:var(--accent)}
  .cloud-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;min-width:0}
  .cloud-grid>*{min-width:0}
  .cloud-status-box{padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--panel-2);font-size:12px;line-height:1.6;color:var(--muted)}
  .auth-tabs{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:16px}
  .auth-tabs button{border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:10px;padding:10px;font-weight:800}
  .auth-tabs button.active{background:var(--text);color:var(--bg);border-color:var(--text)}
  .cloud-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}

  @media (max-width:980px){
    :root{--sidebar:0px}
    .app{display:block}

    .sidebar{
      position:sticky;top:0;inset:auto;width:100%;height:64px;padding:0 14px;
      border-right:0;border-bottom:1px solid var(--line);
      display:flex;align-items:center;gap:10px;overflow:visible;
      background:var(--panel);z-index:60;
    }
    .mobile-menu-btn{
      display:flex;flex:0 0 44px;width:44px;height:44px;border:0;background:transparent;
      border-radius:12px;align-items:center;justify-content:center;flex-direction:column;gap:5px;
      color:var(--text);padding:0;
    }
    .mobile-menu-btn:hover{background:var(--panel-2)}
    .mobile-menu-btn span{
      display:block;width:21px;height:2px;border-radius:999px;background:currentColor;
      transition:transform .22s ease,opacity .22s ease;
    }
    .sidebar.menu-open .mobile-menu-btn span:nth-child(1){transform:translateY(7px) rotate(45deg)}
    .sidebar.menu-open .mobile-menu-btn span:nth-child(2){opacity:0}
    .sidebar.menu-open .mobile-menu-btn span:nth-child(3){transform:translateY(-7px) rotate(-45deg)}

    .brand{
      width:auto;min-width:0;padding:0;margin:0;display:flex;align-items:center;
      overflow:hidden;white-space:nowrap;
    }
    .brand strong{font-size:18px;letter-spacing:.055em;overflow:hidden;text-overflow:ellipsis}
    .brand span{display:none}

    .nav{
      position:fixed;top:64px;left:0;bottom:0;width:min(82vw,320px);
      padding:18px 14px calc(24px + env(safe-area-inset-bottom));
      background:var(--panel);border-right:1px solid var(--line);
      box-shadow:18px 0 44px rgba(0,0,0,.16);
      display:flex;flex-direction:column;gap:6px;overflow-y:auto;
      transform:translateX(-105%);transition:transform .24s ease;z-index:70;
    }
    .sidebar.menu-open .nav{transform:translateX(0)}
    .nav button{
      width:100%;white-space:normal;padding:13px 14px;text-align:left;
      font-size:15px;border-radius:12px;
    }
    .nav .section-label{display:block;padding:18px 13px 6px}

    .mobile-menu-overlay{
      display:block;position:fixed;inset:64px 0 0 0;border:0;padding:0;margin:0;
      background:rgba(0,0,0,.38);opacity:0;visibility:hidden;pointer-events:none;
      transition:opacity .22s ease,visibility .22s ease;z-index:55;
    }
    .mobile-menu-overlay.open{opacity:1;visibility:visible;pointer-events:auto}

    .side-bottom{
      position:fixed;left:14px;bottom:calc(18px + env(safe-area-inset-bottom));
      width:min(calc(82vw - 28px),292px);right:auto;z-index:75;
      display:grid;grid-template-columns:1fr 44px;gap:8px;
      transform:translateX(calc(-105% - 14px));transition:transform .24s ease;
    }
    .sidebar.menu-open .side-bottom{transform:translateX(0)}

    .main{padding:0 16px 80px}
    .topbar{top:64px}
    .hero{grid-template-columns:1fr}
    .hero-side{grid-template-columns:repeat(3,1fr);grid-template-rows:auto}
    .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  }
  @media (max-width:640px){
    .sidebar{overflow:visible}
    .brand{min-width:0}
    .brand span{display:none}

    .nav{width:min(86vw,310px)}
    .side-bottom{width:min(calc(86vw - 28px),282px)}
    .main{padding-left:12px;padding-right:12px}
    .topbar{gap:8px;padding:12px 0}
    .topbar .hide-mobile{display:none}
    .search{max-width:none;width:100%}
    .search input{height:44px;padding:0 14px 0 40px;font-size:16px}
    .search:before{left:15px;top:6px}

    .hero-main{padding:28px;min-height:280px}
    .hero-side{grid-template-columns:1fr}
    .grid{grid-template-columns:1fr}
    .form-grid,.split,.cloud-grid{grid-template-columns:minmax(0,1fr)}
    .form-grid{gap:12px}
    .form-group{gap:6px;min-width:0}
    label{font-size:13px;line-height:1.35}

    input:not([type="checkbox"]):not([type="radio"]):not([type="file"]),select{
      width:100%;height:46px;min-height:46px;padding:0 12px;font-size:16px;line-height:1.2;border-radius:11px;
    }
    input[type="file"]{width:100%;font-size:14px;padding:10px}
    textarea{width:100%;min-height:88px;padding:10px 12px;font-size:16px;line-height:1.5}
    .editor{width:100%;min-height:220px;padding:12px;font-size:16px}

    .modal{padding:0;align-items:stretch;overflow:hidden}
    .modal-card{
      width:100%;max-width:none!important;height:100dvh;max-height:100dvh;min-height:100dvh;
      border-radius:0;border-left:0;border-right:0;display:flex;flex-direction:column;overflow:hidden;
    }
    .modal-head{position:relative;top:auto;flex:0 0 auto;padding:14px 16px}
    .modal-head h2{font-size:20px}
    .modal-body{
      flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
      padding:16px;padding-bottom:calc(24px + env(safe-area-inset-bottom));
    }
    .modal-foot{
      position:relative;bottom:auto;flex:0 0 auto;padding:12px 16px calc(12px + env(safe-area-inset-bottom));
      flex-wrap:wrap;background:var(--bg)
    }
    .modal-foot .btn{min-height:44px}
    .icon-btn{width:44px;height:44px;min-width:44px}

    .dyn-row{grid-template-columns:minmax(0,1fr) 78px 82px 40px}
    .step-row{grid-template-columns:36px minmax(0,1fr) 40px}
    .photos{grid-template-columns:repeat(3,1fr)}
    .kv{grid-template-columns:1fr}
    .kv div:nth-child(odd){margin-top:8px}

    .panel{padding:18px;min-width:0}
    .switch-line{align-items:flex-start;flex-wrap:wrap;gap:12px}
    .cloud-actions{gap:8px}
    .cloud-actions .btn{flex:1 1 auto}
    .cloud-status-box{overflow-wrap:anywhere}
    #supabaseUrl,#supabaseKey{width:100%;min-width:0}

    .fab{display:block;position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom));z-index:40;border:0;background:var(--accent);color:#fff;width:56px;height:56px;border-radius:50%;font-size:26px;box-shadow:var(--shadow)}
  }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="siteSidebar">
    <button class="mobile-menu-btn" type="button" onclick="toggleMobileMenu()" aria-label="메뉴 열기" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
    <button class="brand" onclick="go('home');closeMobileMenu()">
      <strong>TASTE ARCHIVE</strong>
      <span>나의 미각 기록</span>
    </button>
    <nav class="nav">
      <button data-page="home" onclick="go(\'home\');closeMobileMenu()">홈</button>
      <button data-page="tasting" onclick="go(\'tasting\');closeMobileMenu()">테이스팅</button>
      <button data-page="recipe" onclick="go(\'recipe\');closeMobileMenu()">레시피</button>
      <button data-page="food" onclick="go(\'food\');closeMobileMenu()">스터디</button>
      <div class="section-label">LIBRARY</div>
      <button data-page="favorites" onclick="go(\'favorites\');closeMobileMenu()">즐겨찾기</button>
      <button data-page="stats" onclick="go(\'stats\');closeMobileMenu()">통계</button>
      <button data-page="settings" onclick="go(\'settings\');closeMobileMenu()">설정</button>
    </nav>
    <div class="side-bottom">
      <button class="btn" onclick="openQuickAdd()">+ 새 기록</button>
      <button class="icon-btn" onclick="toggleTheme()" title="화면 전환">◐</button>
    </div>
  </aside>
  <button id="mobileMenuOverlay" class="mobile-menu-overlay" type="button" onclick="closeMobileMenu()" aria-label="메뉴 닫기"></button>

  <main class="main">
    <div class="topbar">
      <div class="search">
        <input id="globalSearch" placeholder="검색어를 입력하세요" onkeydown="if(event.key==='Enter') runSearch()" />
      </div>
      <button id="cloudStatusBtn" class="cloud-pill hide-mobile" onclick="cloudStatusAction()" title="Supabase 클라우드"><span class="dot"></span><span id="cloudStatusText">클라우드 설정</span></button>
      <button class="icon-btn hide-mobile" onclick="toggleTheme()" title="다크/라이트">◐</button>
      <button class="btn primary hide-mobile" onclick="openQuickAdd()">+ 새 기록</button>
    </div>
    <section id="page" class="page"></section>
  </main>
</div>

<button class="fab" onclick="openQuickAdd()">＋</button>

<div id="quickModal" class="modal" onclick="modalBackdrop(event,'quickModal')">
  <div class="modal-card" style="max-width:520px">
    <div class="modal-head"><h2>새 기록</h2><button class="icon-btn" onclick="closeModal('quickModal')">×</button></div>
    <div class="modal-body">
      <div class="grid" style="grid-template-columns:1fr">
        <button class="panel" style="text-align:left" onclick="closeModal('quickModal');openTastingForm()"><b>테이스팅 노트</b><div class="small">술의 정보, 향, 맛, 피니시, 페어링을 기록합니다</div></button>
        <button class="panel" style="text-align:left" onclick="closeModal('quickModal');openRecipeForm()"><b>레시피 노트</b><div class="small">요리의 순서, 재료, 사진을 기록합니다</div></button>
        <button class="panel" style="text-align:left" onclick="closeModal('quickModal');openFoodForm()"><b>스터디</b><div class="small">공부한 내용을 정리합니다</div></button>
      </div>
    </div>
  </div>
</div>

<div id="formModal" class="modal" onclick="modalBackdrop(event,'formModal')"><div id="formModalCard" class="modal-card"></div></div>
<div id="detailModal" class="modal" onclick="modalBackdrop(event,'detailModal')"><div id="detailModalCard" class="modal-card"></div></div>

<div id="authModal" class="modal" onclick="modalBackdrop(event,'authModal')">
  <div class="modal-card" style="max-width:520px">
    <div class="modal-head"><h2>클라우드 계정</h2><button class="icon-btn" onclick="closeModal('authModal')">×</button></div>
    <div class="modal-body">
      <div class="auth-tabs">
        <button id="authTabLogin" type="button" class="active" onclick="setAuthMode('login')">로그인</button>
        <button id="authTabSignup" type="button" onclick="setAuthMode('signup')">계정 만들기</button>
      </div>
      <form id="cloudAuthForm" onsubmit="submitCloudAuth(event)">
        <div class="form-grid">
          <div class="form-group full"><label>이메일</label><input id="cloudEmail" type="email" required autocomplete="email" placeholder="email@example.com"></div>
          <div class="form-group full"><label>비밀번호</label><input id="cloudPassword" type="password" required minlength="6" autocomplete="current-password" placeholder="6자 이상"></div>
        </div>
        <div id="authHelp" class="notice" style="margin-top:12px">Supabase 계정으로 로그인하면 이 브라우저의 기록을 클라우드와 동기화할 수 있습니다.</div>
        <div class="modal-foot" style="margin:18px -22px -22px">
          <button type="button" class="btn" onclick="closeModal('authModal')">취소</button>
          <button id="cloudAuthSubmit" class="btn primary">로그인</button>
        </div>
      </form>
    </div>
  </div>
</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const DB_NAME='palate_archive_db', DB_VERSION=1, STORES=['tasting','recipe','food'];
const CLOUD_TABLE='taste_archive';
const DEFAULT_SUPABASE_URL='https://nrxppagzqkcipwqlzrkc.supabase.co';
const DEFAULT_SUPABASE_PUBLISHABLE_KEY='sb_publishable_WnuZczFzsOldc55KT9la3g_H7EDEJor';
let db, currentPage='home', currentFilter='all', currentPhotos=[], editing={type:null,id:null};
let supabaseClient=null, cloudSession=null, cloudBusy=false, autoSyncTimer=null, authMode='login';

function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function fmtDate(v){if(!v)return ''; try{return new Date(v).toLocaleDateString('ko-KR')}catch{return v}}
function parseTags(v){return [...new Set(String(v||'').split(',').map(x=>x.trim()).filter(Boolean))]}
function currentTheme(){return document.documentElement.dataset.theme||'light'}

function initDB(){
  return new Promise((resolve,reject)=>{
    const req=indexedDB.open(DB_NAME,DB_VERSION);
    req.onupgradeneeded=e=>{
      const d=e.target.result;
      STORES.forEach(s=>{if(!d.objectStoreNames.contains(s)) d.createObjectStore(s,{keyPath:'id'})});
    };
    req.onsuccess=e=>{db=e.target.result;resolve(db)};
    req.onerror=e=>reject(e.target.error);
  })
}
function tx(store,mode='readonly'){return db.transaction(store,mode).objectStore(store)}
function getAll(store){return new Promise((res,rej)=>{const r=tx(store).getAll();r.onsuccess=()=>res(r.result||[]);r.onerror=()=>rej(r.error)})}
function getOne(store,id){return new Promise((res,rej)=>{const r=tx(store).get(id);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
function putOne(store,obj){return new Promise((res,rej)=>{const r=tx(store,'readwrite').put(obj);r.onsuccess=()=>res(obj);r.onerror=()=>rej(r.error)})}
function deleteOne(store,id){return new Promise((res,rej)=>{const r=tx(store,'readwrite').delete(id);r.onsuccess=()=>res();r.onerror=()=>rej(r.error)})}
function clearStore(store){return new Promise((res,rej)=>{const r=tx(store,'readwrite').clear();r.onsuccess=()=>res();r.onerror=()=>rej(r.error)})}
async function allRecords(){const [t,r,f]=await Promise.all(STORES.map(getAll));return [...t.map(x=>({...x,_type:'tasting'})),...r.map(x=>({...x,_type:'recipe'})),...f.map(x=>({...x,_type:'food'}))]}


async function migrateLegacyValues(){
  const rows=await getAll('tasting');
  for(const x of rows){
    if(x.category==='사케·소츄'){x.category='사케';x.updatedAt=x.updatedAt||new Date().toISOString();await putOne('tasting',x)}
  }
}

function getCloudConfig(){
  const url=(localStorage.getItem('taste_supabase_url')||DEFAULT_SUPABASE_URL||'').trim();
  const key=(localStorage.getItem('taste_supabase_key')||DEFAULT_SUPABASE_PUBLISHABLE_KEY||'').trim();
  const valid=!!(url && key && /^https:\/\/.+\.supabase\.co\/?$/.test(url) && !url.includes('PASTE_') && !key.includes('PASTE_'));
  return {url:url.replace(/\/$/,''),key,valid};
}
function cloudAutoSyncEnabled(){return localStorage.getItem('taste_cloud_auto_sync')!=='0'}
function setCloudMessage(msg){localStorage.setItem('taste_cloud_message',msg||'');updateCloudUI()}
function cloudStatusAction(){
  const cfg=getCloudConfig();
  if(!cfg.valid){go('settings');return}
  if(!cloudSession){openCloudAuth();return}
  go('settings');
}
function updateCloudUI(){
  const btn=document.getElementById('cloudStatusBtn'), txt=document.getElementById('cloudStatusText');
  if(!btn||!txt)return;
  btn.classList.remove('online','warn');
  const cfg=getCloudConfig();
  if(!cfg.valid){txt.textContent='클라우드 설정';btn.classList.add('warn');return}
  if(cloudBusy){txt.textContent='동기화 중…';btn.classList.add('warn');return}
  if(cloudSession){txt.textContent='클라우드 연결됨';btn.classList.add('online');return}
  txt.textContent='클라우드 로그인';
}
async function initCloud(){
  updateCloudUI();
  const cfg=getCloudConfig();
  if(!cfg.valid || !window.supabase?.createClient)return;
  try{
    supabaseClient=window.supabase.createClient(cfg.url,cfg.key);
    const {data,error}=await supabaseClient.auth.getSession();
    if(error)throw error;
    cloudSession=data.session||null;
    supabaseClient.auth.onAuthStateChange((_event,session)=>{cloudSession=session||null;updateCloudUI()});
    if(cloudSession) await startupCloudSync();
  }catch(err){
    console.warn('Supabase init failed',err);
    supabaseClient=null;cloudSession=null;setCloudMessage('Supabase 연결 설정을 확인해주세요.');
  }
  updateCloudUI();
}
async function reinitCloud(){
  supabaseClient=null;cloudSession=null;
  await initCloud();
  render();
}
async function collectCloudPayload(){
  const stores={};
  for(const s of STORES)stores[s]=await getAll(s);
  return {app:'TASTE ARCHIVE',version:2,stores};
}
async function replaceLocalFromPayload(payload){
  if(!payload?.stores)return;
  for(const s of STORES){
    await clearStore(s);
    for(const row of (payload.stores[s]||[]))await putOne(s,row);
  }
}
async function cloudRow(){
  if(!supabaseClient||!cloudSession)return null;
  const {data,error}=await supabaseClient.from(CLOUD_TABLE).select('payload,updated_at').eq('user_id',cloudSession.user.id).maybeSingle();
  if(error)throw error;
  return data||null;
}
async function startupCloudSync(){
  if(!cloudSession||cloudBusy)return;
  try{
    cloudBusy=true;updateCloudUI();
    const remote=await cloudRow();
    const localUpdated=localStorage.getItem('taste_local_updated_at')||'';
    const remoteUpdated=remote?.updated_at||'';
    const localCount=(await allRecords()).length;
    if(!remote){
      if(localCount)await pushCloud(true,true);
    }else if(localUpdated && localUpdated>remoteUpdated){
      await pushCloud(true,true);
    }else{
      await replaceLocalFromPayload(remote.payload);
      localStorage.setItem('taste_local_updated_at',remoteUpdated);
      localStorage.setItem('taste_cloud_last_sync',remoteUpdated);
      await render();
    }
  }catch(err){console.warn('startup sync failed',err);setCloudMessage('자동 동기화에 실패했습니다.')}
  finally{cloudBusy=false;updateCloudUI()}
}
async function pushCloud(silent=false,bypassBusy=false){
  if(!supabaseClient||!cloudSession){
    if(!silent)openCloudAuth();
    return false;
  }
  if(cloudBusy&&!bypassBusy)return false;
  try{
    cloudBusy=true;updateCloudUI();
    const payload=await collectCloudPayload();
    const updatedAt=new Date().toISOString();
    const {error}=await supabaseClient.from(CLOUD_TABLE).upsert({user_id:cloudSession.user.id,payload,updated_at:updatedAt},{onConflict:'user_id'});
    if(error)throw error;
    localStorage.setItem('taste_local_updated_at',updatedAt);
    localStorage.setItem('taste_cloud_last_sync',updatedAt);
    localStorage.setItem('taste_cloud_message','');
    if(!silent)alert('현재 기록을 클라우드에 업로드했습니다.');
    return true;
  }catch(err){
    console.error(err);
    if(!silent)alert('클라우드 업로드에 실패했습니다. Supabase 설정과 로그인 상태를 확인해주세요.');
    return false;
  }finally{cloudBusy=false;updateCloudUI()}
}
async function pullCloud(force=false){
  if(!supabaseClient||!cloudSession){openCloudAuth();return false}
  if(cloudBusy)return false;
  try{
    cloudBusy=true;updateCloudUI();
    const remote=await cloudRow();
    if(!remote){if(!force)alert('클라우드에 저장된 기록이 없습니다.');return false}
    if(!force && !confirm('클라우드 기록으로 이 브라우저의 현재 기록을 교체할까요?'))return false;
    await replaceLocalFromPayload(remote.payload);
    localStorage.setItem('taste_local_updated_at',remote.updated_at||new Date().toISOString());
    localStorage.setItem('taste_cloud_last_sync',remote.updated_at||new Date().toISOString());
    localStorage.setItem('taste_cloud_message','');
    await render();
    if(!force)alert('클라우드 기록을 불러왔습니다.');
    return true;
  }catch(err){
    console.error(err);if(!force)alert('클라우드 기록을 불러오지 못했습니다.');return false;
  }finally{cloudBusy=false;updateCloudUI()}
}
function touchLocalAndSync(){
  localStorage.setItem('taste_local_updated_at',new Date().toISOString());
  if(!cloudSession||!cloudAutoSyncEnabled())return;
  clearTimeout(autoSyncTimer);
  autoSyncTimer=setTimeout(()=>pushCloud(true),700);
}
async function saveCloudSettings(){
  const url=document.getElementById('supabaseUrl')?.value.trim()||'';
  const key=document.getElementById('supabaseKey')?.value.trim()||'';
  localStorage.setItem('taste_supabase_url',url);
  localStorage.setItem('taste_supabase_key',key);
  const auto=document.getElementById('cloudAutoSync');
  if(auto)localStorage.setItem('taste_cloud_auto_sync',auto.checked?'1':'0');
  await reinitCloud();
  const cfg=getCloudConfig();
  alert(cfg.valid?'Supabase 설정을 저장했습니다.':'설정값을 저장했습니다. Project URL과 Publishable key를 확인해주세요.');
}
function openCloudAuth(){
  if(!getCloudConfig().valid){go('settings');return}
  setAuthMode('login');openModal('authModal');
}
function setAuthMode(mode){
  authMode=mode;
  const login=document.getElementById('authTabLogin'),signup=document.getElementById('authTabSignup'),submit=document.getElementById('cloudAuthSubmit'),help=document.getElementById('authHelp'),pw=document.getElementById('cloudPassword');
  if(!login)return;
  login.classList.toggle('active',mode==='login');signup.classList.toggle('active',mode==='signup');
  submit.textContent=mode==='login'?'로그인':'계정 만들기';
  help.textContent=mode==='login'?'Supabase 계정으로 로그인하면 기기 간 기록을 동기화할 수 있습니다.':'계정을 만들면 Supabase 설정에 따라 이메일 인증이 필요할 수 있습니다.';
  if(pw)pw.autocomplete=mode==='login'?'current-password':'new-password';
}
async function submitCloudAuth(e){
  e.preventDefault();
  if(!supabaseClient){alert('먼저 설정에서 Supabase Project URL과 Publishable key를 저장해주세요.');return}
  const email=document.getElementById('cloudEmail').value.trim(),password=document.getElementById('cloudPassword').value;
  try{
    const res=authMode==='login'
      ? await supabaseClient.auth.signInWithPassword({email,password})
      : await supabaseClient.auth.signUp({email,password,options:{emailRedirectTo:location.protocol.startsWith('http')?location.href.split('#')[0]:undefined}});
    if(res.error)throw res.error;
    cloudSession=res.data.session||null;
    if(authMode==='signup'&&!cloudSession){
      alert('계정을 만들었습니다. 이메일 인증을 켜둔 Supabase 프로젝트라면 받은 메일에서 인증한 뒤 로그인해주세요.');
      setAuthMode('login');
      return;
    }
    closeModal('authModal');
    await startupCloudSync();
    updateCloudUI();render();
  }catch(err){alert((authMode==='login'?'로그인':'계정 생성')+'에 실패했습니다: '+(err.message||err))}
}
async function cloudLogout(){
  if(supabaseClient)await supabaseClient.auth.signOut();
  cloudSession=null;updateCloudUI();render();
}

function applyTheme(){
  const saved=localStorage.getItem('palate_theme')||'light';
  document.documentElement.dataset.theme=saved;
  document.querySelector('meta[name="theme-color"]').setAttribute('content',saved==='dark'?'#11110f':'#f4f1ea');
}
function toggleTheme(){
  const next=currentTheme()==='dark'?'light':'dark';
  localStorage.setItem('palate_theme',next);applyTheme();
}

function go(page,filter='all'){
  currentPage=page;currentFilter=filter;
  location.hash=page+(filter!=='all'?'/'+encodeURIComponent(filter):'');
  render();
}
function syncHash(){
  const raw=location.hash.replace('#','')||'home';
  const [p,f]=raw.split('/');
  currentPage=p||'home';currentFilter=f?decodeURIComponent(f):'all';
}
function setActiveNav(){
  document.querySelectorAll('.nav button[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===currentPage));
}

async function render(){
  setActiveNav();
  const page=document.getElementById('page');
  if(currentPage==='home') return renderHome(page);
  if(currentPage==='tasting') return renderLibrary(page,'tasting');
  if(currentPage==='recipe') return renderLibrary(page,'recipe');
  if(currentPage==='food') return renderLibrary(page,'food');
  if(currentPage==='favorites') return renderFavorites(page);
  if(currentPage==='stats') return renderStats(page);
  if(currentPage==='settings') return renderSettings(page);
  if(currentPage==='search') return renderSearch(page);
  return renderHome(page);
}

function emptyBlock(msg){return `<div class="empty">${msg}</div>`}
function cardTypeName(t){return t==='tasting'?'테이스팅':t==='recipe'?'레시피':'스터디'}
function titleOf(x){return x.name||x.title||'제목 없음'}
function categoryOf(x){return x.category||x.cuisine||'기타'}
function metaOf(x){
  if(x._type==='tasting'||x.type==='tasting') return [x.producer,x.country,x.region].filter(Boolean).join(' · ');
  if(x._type==='recipe'||x.type==='recipe') return [x.cuisine,x.servings?x.servings+'인분':'',x.version?x.version:''].filter(Boolean).join(' · ');
  return [x.category,x.source].filter(Boolean).join(' · ');
}
function recordCard(x,type=x._type){
  const img=x.photos?.[0];
  return `<article class="card" onclick="openDetail('${type}','${x.id}')">
    <div class="card-media">${img?`<img src="${img}" alt="">`:`<span>${cardTypeName(type)}</span>`}</div>
    <div class="card-body">
      <div class="card-kicker">${esc(categoryOf(x))}${x.favorite?' · ★':''}</div>
      <div class="card-title">${esc(titleOf(x))}</div>
      <div class="card-meta">${esc(metaOf({...x,_type:type}))}<br>${fmtDate(x.date||x.createdAt)}</div>
      <div class="card-tags">${(x.tags||[]).slice(0,4).map(t=>`<button class="tag" onclick="event.stopPropagation();searchTag('${esc(t)}')">#${esc(t)}</button>`).join('')}</div>
    </div>
  </article>`
}

async function renderHome(page){
  const all=await allRecords(), recent=all.sort((a,b)=>new Date(b.updatedAt||b.createdAt)-new Date(a.updatedAt||a.createdAt)).slice(0,6);
  const counts={tasting:all.filter(x=>x._type==='tasting').length,recipe:all.filter(x=>x._type==='recipe').length,food:all.filter(x=>x._type==='food').length};
  page.innerHTML=`
    <div class="hero">
      <section class="hero-main">
        <div>
          <div class="eyebrow">RAÚL's GASTRONOMY DATABASE</div>
          <h1>TASTE<br>ARCHIVE</h1>
          <p>마신 것, 만든 것, 배운 것을 한곳에 쌓고 서로 연결하는 개인 미식 아카이브입니다. 시간이 지날수록 취향과 경험이 데이터가 됩니다.</p>
        </div>
        <div class="hero-actions">
          <button class="btn primary" onclick="openTastingForm()">테이스팅</button>
          <button class="btn" onclick="openRecipeForm()">레시피</button>
          <button class="btn" onclick="openFoodForm()">스터디</button>
        </div>
      </section>
      <div class="hero-side">
        <div class="stat-card"><span>테이스팅</span><strong>${counts.tasting}</strong></div>
        <div class="stat-card"><span>레시피</span><strong>${counts.recipe}</strong></div>
        <div class="stat-card"><span>스터디</span><strong>${counts.food}</strong></div>
      </div>
    </div>
    <div class="section-head"><div><h2>최근 기록</h2><p>최근 수정하거나 추가한 기록입니다.</p></div></div>
    ${recent.length?`<div class="grid">${recent.map(x=>recordCard(x,x._type)).join('')}</div>`:emptyBlock('아직 기록이 없습니다. 첫 테이스팅이나 레시피를 추가해보세요.')}
  `;
}

const filters={
  tasting:['all','와인','사케','맥주','위스키','전통주·탁주','전통주·약주','전통주·증류주','전통주·소주','기타'],
  recipe:['all','한식','일식','양식','중식','기타'],
  food:['all','식재료','조리법','발효','육가공','치즈','술','페어링','지역음식','기타']
}
const labels={tasting:'테이스팅 노트',recipe:'레시피 노트',food:'푸드 노트'}
async function renderLibrary(page,type){

      <button class="btn primary" onclick="${type==='tasting'?'openTastingForm()':type==='recipe'?'openRecipeForm()':'openFoodForm()'}">+ 새 기록</button>
    </div>
    <div class="toolbar"><div class="chips">
      ${filters[type].map(f=>`<button class="chip ${currentFilter===f?'active':''}" onclick="go('${type}','${f}')">${f==='all'?'전체':f}</button>`).join('')}
    </div></div>
    ${filtered.length?`<div class="grid">${filtered.map(x=>recordCard(x,type)).join('')}</div>`:emptyBlock('이 분류에는 아직 기록이 없습니다.')}
  `;

async function renderFavorites(page){
  const all=(await allRecords()).filter(x=>x.favorite).sort((a,b)=>new Date(b.updatedAt||b.createdAt)-new Date(a.updatedAt||a.createdAt));
  page.innerHTML=`<div class="section-head"><div><div class="eyebrow">LIBRARY</div><h2>즐겨찾기</h2><p>다시 찾고 싶은 기록만 모아봅니다.</p></div></div>${all.length?`<div class="grid">${all.map(x=>recordCard(x,x._type)).join('')}</div>`:emptyBlock('즐겨찾기한 기록이 없습니다.')}`;
}

function countBy(arr,keyFn){
  const m={};arr.forEach(x=>{const k=keyFn(x)||'미분류';m[k]=(m[k]||0)+1});return Object.entries(m).sort((a,b)=>b[1]-a[1])
}
function barChart(items){
  if(!items.length)return emptyBlock('아직 통계를 만들 데이터가 없습니다.');
  const max=Math.max(...items.map(x=>x[1]));
  return `<div class="bar-list">${items.slice(0,10).map(([k,v])=>`<div class="bar-row"><b>${esc(k)}</b><div class="bar"><i style="width:${v/max*100}%"></i></div><span>${v}</span></div>`).join('')}</div>`
}
async function renderStats(page){
  const all=await allRecords(), tast=all.filter(x=>x._type==='tasting'), rec=all.filter(x=>x._type==='recipe');
  page.innerHTML=`
    <div class="section-head"><div><div class="eyebrow">INSIGHTS</div><h2>통계</h2><p>기록이 쌓일수록 취향이 선명하게 보입니다.</p></div></div>
    <div class="grid">
      <div class="panel"><h3>술 종류</h3>${barChart(countBy(tast,x=>x.category))}</div>
      <div class="panel"><h3>국가</h3>${barChart(countBy(tast,x=>x.country))}</div>
      <div class="panel"><h3>요리 분류</h3>${barChart(countBy(rec,x=>x.cuisine))}</div>
    </div>
    <div class="section-head"><div><h2>태그</h2></div></div>
    <div class="panel">${barChart(countBy(all.flatMap(x=>(x.tags||[]).map(t=>({tag:t}))),x=>x.tag))}</div>
  `;
}

async function renderSettings(page){
  const cfg=getCloudConfig(), last=localStorage.getItem('taste_cloud_last_sync'), msg=localStorage.getItem('taste_cloud_message')||'';

async function resizeImage(file){
  return new Promise((resolve,reject)=>{
    const img=new Image(), reader=new FileReader();
    reader.onload=()=>img.src=reader.result;
    reader.onerror=reject;
    img.onload=()=>{
      const max=1600, scale=Math.min(1,max/Math.max(img.width,img.height));
      const c=document.createElement('canvas');c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      resolve(c.toDataURL('image/jpeg',.82));
    };
    reader.readAsDataURL(file);
  })
}
async function handlePhotos(input){
  const files=[...input.files].slice(0,12-currentPhotos.length);
  for(const f of files){if(f.type.startsWith('image/')) currentPhotos.push(await resizeImage(f))}
  renderPhotoPreview();
}

  await putOne('recipe',obj);touchLocalAndSync();closeModal('formModal');go('recipe');
}

  const out=[];
  for(const ref of arr){
    const [type,id]=ref.split(':');const x=await getOne(type,id);
    if(x)out.push(`<button class="tag" onclick="closeModal('detailModal');openDetail('${type}','${id}')">${esc(titleOf(x))} · ${cardTypeName(type)}</button>`)
  }
  return out.join(' ');
}
function gallery(photos=[]){return photos.length?`<div class="photos">${photos.map(p=>`<div class="photo"><img src="${p}"></div>`).join('')}</div>`:''}

async function openDetail(type,id){
  const x=await getOne(type,id); if(!x)return;
  const related=await relatedLinks(x.related||[]);
  let body='';
  if(type==='tasting') body=`
    ${x.photos?.[0]?`<div class="detail-cover"><img src="${x.photos[0]}"></div>`:''}
    <div class="eyebrow">${esc(x.category||'')}</div><div class="detail-title">${esc(x.name)}</div>
    <div class="detail-meta">${esc([x.producer,x.country,x.region].filter(Boolean).join(' · '))} · ${fmtDate(x.date||x.createdAt)}</div>
    <div class="card-tags">${(x.tags||[]).map(t=>`<button class="tag" onclick="closeModal('detailModal');searchTag('${esc(t)}')">#${esc(t)}</button>`).join('')}</div>
    <div class="detail-section"><h3>기본 정보</h3><div class="kv">
      <div>생산자</div><div>${esc(x.producer||'-')}</div><div>양조장·증류소</div><div>${esc(x.brewery||'-')}</div><div>빈티지</div><div>${esc(x.vintage||'-')}</div><div>도수</div><div>${esc(x.abv||'-')}${x.abv?'%':''}</div><div>가격</div><div>${x.price?Number(x.price).toLocaleString()+'원':'-'}</div><div>장소</div><div>${esc(x.place||'-')}</div>
    </div></div>
    <div class="detail-section"><h3>테이스팅</h3><div class="kv">
      <div>색</div><div>${esc(x.color||'-')}</div><div>향</div><div>${esc(x.aroma||'-')}</div><div>맛</div><div>${esc(x.taste||'-')}</div><div>질감</div><div>${esc(x.texture||'-')}</div><div>피니시</div><div>${esc(x.finish||'-')}</div><div>밸런스·복합성</div><div>${esc(x.balance||'-')}</div><div>전체 인상</div><div>${esc(x.impression||'-')}</div><div>재구매</div><div>${esc(x.repurchase||'-')}</div>
    </div></div>
    <div class="detail-section"><h3>페어링</h3><div class="kv"><div>함께 먹은 음식</div><div>${esc(x.pairingFood||'-')}</div><div>점수</div><div>${x.pairingScore?'★'.repeat(Number(x.pairingScore)):'-'}</div><div>이유</div><div>${esc(x.pairingWhy||'-')}</div><div>다음 시도</div><div>${esc(x.pairingNext||'-')}</div></div></div>
    ${x.photos?.length>1?`<div class="detail-section"><h3>사진</h3>${gallery(x.photos.slice(1))}</div>`:''}
    ${related?`<div class="detail-section"><h3>연결 기록</h3>${related}</div>`:''}
  `;
  if(type==='recipe'){
    const base=Number(x.servings)||1;
    body=`
      ${x.photos?.[0]?`<div class="detail-cover"><img src="${x.photos[0]}"></div>`:''}
      <div class="eyebrow">${esc(x.cuisine||'')}</div><div class="detail-title">${esc(x.title)}</div>
      <div class="detail-meta">${esc(x.version||'')} · 기준 ${base}인분 · ${fmtDate(x.updatedAt||x.createdAt)}</div>
      <div class="card-tags">${(x.tags||[]).map(t=>`<button class="tag" onclick="closeModal('detailModal');searchTag('${esc(t)}')">#${esc(t)}</button>`).join('')}</div>
      <div class="detail-section"><h3>인분 자동환산</h3><div class="chips">${[1,2,3,4,6].map(n=>`<button class="chip" onclick="scaleRecipe('${id}',${n},this)">${n}인분</button>`).join('')}</div></div>
      <div class="detail-section"><h3>재료</h3><div id="scaledIngredients">${(x.ingredients||[]).map(i=>`<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)"><b>${esc(i.name)}</b><span>${esc(i.amount)} ${esc(i.unit)}</span></div>`).join('')}</div></div>
      <div class="detail-section"><h3>조리 순서</h3>${(x.steps||[]).map((s,i)=>`<div style="display:grid;grid-template-columns:34px 1fr;gap:10px;margin:12px 0"><div class="step-no" style="width:34px;height:34px">${i+1}</div><div style="line-height:1.7">${esc(s)}</div></div>`).join('')}</div>
      <div class="detail-section"><h3>메모 / 개선점</h3><div class="rich">${esc(x.notes||'-').replace(/\n/g,'<br>')}</div></div>
      <div class="detail-section"><h3>추천 페어링</h3><div>${esc(x.pairing||'-')}</div></div>
      ${x.versionHistory?.length?`<div class="detail-section"><h3>버전 히스토리</h3>${x.versionHistory.slice(0,8).map(v=>`<div class="notice" style="margin-bottom:7px"><b>${esc(v.version||'이전 버전')}</b> · ${fmtDate(v.savedAt)} · ${esc(v.servings||'')}인분</div>`).join('')}</div>`:''}
      ${x.photos?.length>1?`<div class="detail-section"><h3>사진</h3>${gallery(x.photos.slice(1))}</div>`:''}
      ${related?`<div class="detail-section"><h3>연결 기록</h3>${related}</div>`:''}
    `;
  }
  if(type==='food') body=`
    ${x.photos?.[0]?`<div class="detail-cover"><img src="${x.photos[0]}"></div>`:''}
    <div class="eyebrow">${esc(x.category||'')}</div><div class="detail-title">${esc(x.title)}</div>
    <div class="detail-meta">${esc(x.source||'')} ${x.source?'·':''} ${fmtDate(x.updatedAt||x.createdAt)}</div>
    <div class="card-tags">${(x.tags||[]).map(t=>`<button class="tag" onclick="closeModal('detailModal');searchTag('${esc(t)}')">#${esc(t)}</button>`).join('')}</div>
    <div class="detail-section"><div class="rich">${x.content||'<span class="small">내용 없음</span>'}</div></div>
    ${x.photos?.length>1?`<div class="detail-section"><h3>사진</h3>${gallery(x.photos.slice(1))}</div>`:''}
    ${related?`<div class="detail-section"><h3>연결 기록</h3>${related}</div>`:''}
  `;
  document.getElementById('detailModalCard').innerHTML=`
    <div class="modal-head"><h2>${cardTypeName(type)}</h2><div style="display:flex;gap:7px"><button class="icon-btn" onclick="toggleFavorite('${type}','${id}')">${x.favorite?'★':'☆'}</button><button class="icon-btn" onclick="closeModal('detailModal')">×</button></div></div>
    <div class="modal-body">${body}</div>
    <div class="modal-foot"><button class="btn danger" onclick="removeRecord('${type}','${id}')">삭제</button><button class="btn" onclick="closeModal('detailModal');${type==='tasting'?`openTastingForm('${id}')`:type==='recipe'?`openRecipeForm('${id}')`:`openFoodForm('${id}')`}">수정</button></div>`;
  openModal('detailModal');
}
async function scaleRecipe(id,n,btn){
  const x=await getOne('recipe',id), base=Number(x.servings)||1, ratio=n/base;
  document.getElementById('scaledIngredients').innerHTML=(x.ingredients||[]).map(i=>{
    const val=Number(i.amount);const amount=Number.isFinite(val)?Math.round(val*ratio*100)/100:i.amount;
    return `<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)"><b>${esc(i.name)}</b><span>${esc(amount)} ${esc(i.unit)}</span></div>`
  }).join('');
  btn.parentElement.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));btn.classList.add('active');
}
async function toggleFavorite(type,id){
  const x=await getOne(type,id);x.favorite=!x.favorite;x.updatedAt=new Date().toISOString();await putOne(type,x);touchLocalAndSync();openDetail(type,id);render();
}
async function removeRecord(type,id){
  if(!confirm('이 기록을 삭제할까요?'))return;
  await deleteOne(type,id);touchLocalAndSync();closeModal('detailModal');render();
}

async function exportData(){
  const data={app:'TASTE ARCHIVE',version:1,exportedAt:new Date().toISOString(),theme:localStorage.getItem('palate_theme')||'light',stores:{}};
  for(const s of STORES)data.stores[s]=await getAll(s);
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`taste-archive-backup-${new Date().toISOString().slice(0,10)}.json`;a.click();URL.revokeObjectURL(a.href);
}
async function importData(e){
  const file=e.target.files[0];if(!file)return;
  try{
    const data=JSON.parse(await file.text());
    if(!data.stores)throw new Error('잘못된 파일');
    if(!confirm('현재 데이터에 백업 내용을 추가/덮어쓸까요? 같은 ID의 기록은 백업 기준으로 갱신됩니다.'))return;
    for(const s of STORES) for(const x of (data.stores[s]||[])) await putOne(s,x);
    if(data.theme){localStorage.setItem('palate_theme',data.theme);applyTheme()}
    touchLocalAndSync();alert('복원이 완료되었습니다.');render();
  }catch(err){alert('복원할 수 없는 JSON 파일입니다.')}
  e.target.value='';
}
async function wipeData(){
  if(!confirm('모든 기록을 완전히 삭제할까요? 이 작업은 되돌릴 수 없습니다.'))return;
  for(const s of STORES)await clearStore(s);
  touchLocalAndSync();render();
}

window.addEventListener('hashchange',()=>{syncHash();render()});
window.addEventListener('DOMContentLoaded',async()=>{
  applyTheme();await initDB();await migrateLegacyValues();syncHash();await render();await initCloud();
});
</script>
</body>
</html>
